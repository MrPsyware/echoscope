name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .tools/platformio
            .pio/libdeps
          key: esp32-${{ runner.os }}-${{ hashFiles('platformio.ini', 'requirements-build.txt') }}
      - run: make setup
      - run: make test
      - run: make firmware
      - uses: actions/upload-artifact@v4
        with:
          name: echoscope-firmware
          path: dist/

  info-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r info-service/requirements.txt
      - run: python -m unittest discover -v
        working-directory: info-service
      - run: docker build -t echoscope-photos:test info-service
      - name: Exercise logbook sorting with production container restrictions
        run: docker compose -p echoscope-ci -f info-service/compose.yaml run --build --rm -T --no-deps photos python - < tests/docker_logbook.py
      - name: Remove isolated test storage
        if: always()
        run: docker compose -p echoscope-ci -f info-service/compose.yaml down -v
