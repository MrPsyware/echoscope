name: echoscope-photos
services:
  photos:
    build: .
    ports:
      - "0.0.0.0:${INFO_PORT:-${PHOTO_PORT:-8086}}:8086"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SQLITE_TMPDIR: /tmp
      TMPDIR: /tmp
      ECHOSCOPE_URL: ${ECHOSCOPE_URL:-}
      ECHOSCOPE_TOKEN: ${ECHOSCOPE_TOKEN:-}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-0}
      ENABLE_STARGAZING: ${ENABLE_STARGAZING:-1}
      ENABLE_WEATHER: ${ENABLE_WEATHER:-1}
      ENABLE_FLIGHTS: ${ENABLE_FLIGHTS:-1}
      ENABLE_AIRPORTS: ${ENABLE_AIRPORTS:-1}
      ENABLE_PHOTOS: ${ENABLE_PHOTOS:-1}
      TILE_URL: ${TILE_URL:-}
      MAP_CREDIT: ${MAP_CREDIT:-Copyright OpenStreetMap contributors}
      ENABLE_MAPS: ${ENABLE_MAPS:-1}
      ENABLE_SATELLITES: ${ENABLE_SATELLITES:-1}
      SATELLITE_IDS: ${SATELLITE_IDS:-25544,48274}
    volumes:
      - info-cache:/data
    mem_limit: 256m
    pids_limit: 64

volumes:
  info-cache:
